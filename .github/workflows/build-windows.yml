name: Build Tasks.org Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant gradle permission
        shell: bash
        run: chmod +x ./gradlew

      - name: Show Gradle tasks
        shell: bash
        run: |
          ./gradlew tasks --all

      - name: Build Windows MSI
        shell: bash
        run: |
          ./gradlew packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: tasks-windows-msi
          path: |
            **/*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tasks-windows-exe
          path: |
            **/*.exe
