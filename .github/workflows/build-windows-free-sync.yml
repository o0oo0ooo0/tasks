name: Build Tasks.org Windows (Free sync)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - free-sync

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unlock CalDAV / Etebase / Microsoft / Google Tasks sync
        shell: bash
        run: |
          set -e
          # 1) SyncRunner: always grant Pro so all sync adapters run without subscription
          sed -i \
            -e 's/val hasPro = hasTasksOrg || subscriptionProvider.subscription.first() != null/val hasPro = true/' \
            -e 's/googleAndMicrosoftPro = hasPro || !subscriptionProvider.googleAndMicrosoftRequirePro,/googleAndMicrosoftPro = true,/' \
            composeApp/src/commonMain/kotlin/org/tasks/sync/SyncRunner.kt

          # 2) AddAccountScreen: treat Microsoft/Google/CalDAV/Etebase as free accounts
          sed -i \
            -e '/val isDesktop = configuration.billingProvider == BillingProvider.PADDLE/d' \
            -e 's/if (configuration.supportsMicrosoft && !isDesktop) add(Platform.MICROSOFT)/if (configuration.supportsMicrosoft) add(Platform.MICROSOFT)/' \
            -e 's/if (configuration.supportsGoogleTasks && !isDesktop) add(Platform.GOOGLE_TASKS)/if (configuration.supportsGoogleTasks) add(Platform.GOOGLE_TASKS)/' \
            -e 's/if (configuration.supportsOpenTasks) add(Platform.DAVX5)/if (configuration.supportsOpenTasks) add(Platform.DAVX5)\n                    if (configuration.supportsCaldav) add(Platform.CALDAV)\n                    if (configuration.supportsEteSync) add(Platform.ETEBASE)/' \
            -e '/if (configuration.supportsMicrosoft && isDesktop) add(Platform.MICROSOFT)/d' \
            -e '/if (configuration.supportsGoogleTasks && isDesktop) add(Platform.GOOGLE_TASKS)/d' \
            -e '/if (configuration.supportsCaldav) add(Platform.CALDAV)/d' \
            -e '/if (configuration.supportsEteSync) add(Platform.ETEBASE)/d' \
            kmp/src/commonMain/kotlin/org/tasks/compose/accounts/AddAccountScreen.kt

          echo "=== SyncRunner.kt ==="
          grep -n "val hasPro\|googleAndMicrosoftPro" composeApp/src/commonMain/kotlin/org/tasks/sync/SyncRunner.kt
          echo "=== AddAccountScreen.kt ==="
          grep -n "supportsMicrosoft\|supportsGoogleTasks\|supportsCaldav\|supportsEteSync\|isDesktop" kmp/src/commonMain/kotlin/org/tasks/compose/accounts/AddAccountScreen.kt

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant gradle permission
        shell: bash
        run: chmod +x ./gradlew

      - name: Build Windows MSI
        shell: bash
        run: |
          ./gradlew packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: tasks-windows-msi
          path: |
            **/*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tasks-windows-exe
          path: |
            **/*.exe
