name: Build Tasks.org Windows (Free sync)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - free-sync

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unlock CalDAV / Etebase / Microsoft / Google Tasks sync
        shell: bash
        run: |
          python .github/scripts/unlock-desktop-sync.py .
          echo "=== SyncRunner.kt ==="
          grep -n "val hasPro\|googleAndMicrosoftPro" composeApp/src/commonMain/kotlin/org/tasks/sync/SyncRunner.kt
          echo "=== AddAccountScreen.kt ==="
          grep -n "supportsMicrosoft\|supportsGoogleTasks\|supportsCaldav\|supportsEteSync\|isDesktop" kmp/src/commonMain/kotlin/org/tasks/compose/accounts/AddAccountScreen.kt

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant gradle permission
        shell: bash
        run: chmod +x ./gradlew

      - name: Build Windows MSI
        shell: bash
        run: |
          ./gradlew clean
          ./gradlew packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: tasks-windows-msi
          path: |
            **/*.msi

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tasks-windows-exe
          path: |
            **/*.exe
